[project]
name = "cv-labs"
version = "0.1.0"
description = "Computer vision code for CSST106 Labs 1-7"
requires-python = ">=3.12,<3.13"
# Python 3.12 is required: PyTorch stopped publishing Intel Mac wheels at 2.2.2,
# which supports Python <= 3.12 and needs NumPy 1.x.
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "matplotlib>=3.8,<3.11",
    "scipy>=1.11,<1.16",
    "scikit-learn>=1.4,<1.8",
    "scikit-image>=0.22,<0.26",
    "pooch>=1.8",
    "joblib>=1.3",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "ultralytics>=8.3,<8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_labs"]
