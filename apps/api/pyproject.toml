[project]
name = "csst106-api"
version = "0.1.0"
description = "HTTP API serving the CSST106 labs"
requires-python = ">=3.12,<3.13"
dependencies = ["cv-labs", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.uv.sources]
cv-labs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
